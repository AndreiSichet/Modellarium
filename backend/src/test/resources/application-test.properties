# THE TEST SUITE'S OWN DATABASE, AND THIS FILE IS THE FLOOR UNDER THE GUARD.
#
# src/main/resources/application.properties points at
# jdbc:postgresql://${DB_HOST:localhost}:5432/basketball_predictor - the
# production database name, defaulting to localhost, which is the compose
# container the running app serves from. Two test classes load a full
# context, so Flyway migrates and the query-count test inserts a few hundred
# game rows. With DB_PASSWORD set, `mvn verify` did that to the live
# application database; on 6 November it only failed to because the password
# was absent and the connection never opened.
#
# TestDatabase.url() refuses the production name and is wired into both of
# those classes through @DynamicPropertySource, which runs before the context
# refreshes and therefore before Flyway. This file is the second line: a test
# added later that forgets the dynamic source still lands here rather than on
# production.
#
# CI'S SERVICE CONTAINER IS NAMED THE SAME AS THIS. It used to be
# `basketball_predictor`, identical to production from the url's point of
# view, so no url-based rule could have told them apart - which is why the
# answer is a distinct NAME rather than a heuristic about hosts.
#
# AND THE FILENAME IS LOAD-BEARING. The first draft of this file was named
# application.properties, which does not layer on src/main's copy - it
# SHADOWS it. `classpath:/application.properties` resolves to the first match
# on the classpath, and surefire puts target/test-classes ahead of
# target/classes, so main's datasource credentials, ddl-auto, flyway
# baseline, inference url and sync cron all vanished. Measured: the context
# failed with "The server requested SCRAM-based authentication, but no
# password was provided" - with DB_PASSWORD set, because the ${DB_PASSWORD}
# reference was in the shadowed file. A profile-specific file is ADDITIVE, so
# this one layers the url over main's settings and changes nothing else.
#
# The profile is activated in pom.xml's surefire configuration rather than by
# @ActiveProfiles, so a test added later cannot forget it.
#
# To create it locally, once:
#   docker exec -e PGPASSWORD=postgres basketball-predictor-postgres-1 \
#     psql -U postgres -c 'CREATE DATABASE basketball_predictor_test'
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:basketball_predictor_test}
