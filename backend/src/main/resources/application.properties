spring.application.name=basketball-predictor
# Host is overridable so the same jar runs on the host and in a container,
# where localhost would mean the container itself. Defaults to localhost, so
# nothing changes for local runs.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/basketball_predictor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# VALIDATE, not none. Flyway owns the schema now, and validate makes
# Hibernate check the entities against it at boot and refuse to start on a
# mismatch. `none` would leave the same silence with a different mechanism:
# under the old `update` a renamed field quietly added a column and left the
# old one populated, and nothing ever errored.
spring.jpa.hibernate.ddl-auto=validate

# An existing database already has the schema this baseline describes, so
# Flyway must adopt it rather than refuse a non-empty schema.
spring.flyway.baseline-on-migrate=true

# No implicit session during serialization. Any code path that forgets to
# load what it needs fails with LazyInitializationException instead of
# working by accident.
spring.jpa.open-in-view=false

# Same reason as DB_HOST above.
inference.service.url=${INFERENCE_URL:http://localhost:8000}

# Without this a 400 arrives with no reason, so the caller can't tell an
# unknown team from a date the inference service refused.
spring.web.error.include-message=always

# The browser origin allowed by CORS. Overridable for the same reason as
# DB_HOST and INFERENCE_URL, though under compose it stays localhost:3000 -
# that is the address the browser uses, not an internal service name.
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# How far ahead the schedule sync caches fixtures. The browse endpoint can
# only return what has been cached, so this bounds its widest useful
# daysAhead. Generous by default because the old implementation asked the
# live API for whatever was requested.
schedule.sync.days-ahead=120

# Every six hours. Overridable so the cadence can be shortened for a smoke
# test without a rebuild.
schedule.sync.cron=0 0 */6 * * *
