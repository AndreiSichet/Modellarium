name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Four independent jobs, deliberately not chained: they fail for different
# reasons, and running them in parallel means one slow job does not hide
# the others' results.
jobs:
  backend:
    name: backend (Java 21 + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: basketball_predictor
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Holds the job until Postgres actually accepts connections, which
        # is the same gap the compose healthcheck closes: Hikari fails fast
        # against a database that is merely started.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No -DskipTests here, unlike every local build and the backend
      # Dockerfile. contextLoads starts the whole Spring context and needs a
      # live database; the service container above is the first environment
      # where that has been true automatically.
      - name: Build and test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PASSWORD: postgres
        run: mvn -B clean verify

  frontend:
    name: frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 20 to match frontend/Dockerfile's build stage, not whatever is
      # installed locally.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Mirrors frontend/Dockerfile. setup-node installs whatever npm ships
      # with the runner image, which is not necessarily the version that
      # generated package-lock.json - and npm ci then fails outright on the
      # resulting lockfile mismatch ("Missing: yaml@2.9.0 from lock file").
      - name: Pin npm to match lock file
        working-directory: frontend
        run: npm install -g npm@11.16.0

      - name: Install
        working-directory: frontend
        run: npm ci

      # --watchAll=false because create-react-app's runner defaults to watch
      # mode, which never exits and would hang the job until it times out.
      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false

      # Actions sets CI=true, which also makes this build fail on warnings.
      - name: Production build
        working-directory: frontend
        run: npm run build

  inference-service:
    name: inference-service (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # player_boxscores_with_rolling.csv is stored in Git LFS.
          # Without this, checkout leaves a ~130-byte pointer file
          # where a 77 MB CSV should be, and the failure is confusing:
          # pandas reports a malformed CSV, or COPY succeeds with
          # garbage. Only the two jobs that read it pay the download.
          lfs: true

      # 3.14 to match inference-service/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: inference-service/requirements.txt

      - name: Install
        run: pip install -r inference-service/requirements.txt

      # A real boot, not an import check. Two bugs this project already hit
      # only show up here: a missing scikit-learn (xgboost's sklearn API
      # raises on XGBClassifier(), so the team count never reaches 7) and a
      # broken uvicorn entry point (nothing ever answers on the port).
      #
      # Needs the committed tables plus every model directory. The tables
      # are supplied through DATA_DIR below rather than being baked into the
      # image, which is the one thing about this job that changed when the
      # served data moved onto a volume.
      # Every one of them is read at startup, so a missing file is a failed
      # boot rather than a lazy error later.
      # DATA_DIR IS REQUIRED NOW, AND IT POINTS AT THE COMMITTED COPY.
      #
      # The image no longer carries any history table - they arrive on a
      # mounted volume in production - and the service refuses to boot
      # without this, deliberately, with no fallback. So CI has to supply it,
      # and the committed tables in this checkout are what it supplies.
      #
      # THE COMMITTED COPY IS NO LONGER WHAT PRODUCTION SERVES. It stays in
      # the repo for exactly two purposes: this job, and seeding the volume
      # the first time. Anyone reading a committed games_final.csv and
      # concluding that is what the app is serving would be wrong, which is
      # why it is said here and in served_data.
      # THE NFL'S TABLES CANNOT BE COMMITTED, SO CI GENERATES INVENTED ONES.
      # The real NFL history is derived from English Wikipedia and is
      # CC BY-SA 4.0; this repository is not licensed to redistribute a
      # derived database, so no NFL table is in git (see
      # data-pipeline/nfl/DATA_LICENSE.md). From phase 4 the service refuses
      # to boot without them, and those two facts are only compatible if this
      # job supplies a set that carries no source content at all.
      #
      # Every score here comes from a seeded PRNG and every venue is the
      # string "Synthetic Stadium". The only thing shared with the real
      # tables is the schema and the 32 franchise ids, and those are
      # project-authored reference data in nfl_franchises.py.
      #
      # IT EXISTS SO THE CONTAINER BOOTS, AND FOR NOTHING ELSE. No recorded
      # number, no wire-shape fixture and no prediction value may come from
      # it - the scores are noise, so a prediction computed from them means
      # only "the code path ran".
      - name: Generate the synthetic NFL tables
        run: python data-pipeline/nfl/preprocessing/make_synthetic_nfl_tables.py

      - name: Boot the service and check health
        working-directory: inference-service
        env:
          DATA_DIR: ${{ github.workspace }}/data-pipeline/data
          # PRODUCTION REFUSES THE SET THIS FLAG ADMITS, and that is the
          # direction the guard runs in. live_nfl_features.refuse_synthetic
          # raises on nfl_synthetic.json unless this is exactly "1", so a
          # production boot cannot serve invented scores as results. Setting
          # it anywhere but here would defeat the whole arrangement.
          MODELLARIUM_ALLOW_SYNTHETIC_NFL: "1"
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          UVICORN_PID=$!

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health -o health.json; then break; fi
            sleep 2
          done

          if [ ! -f health.json ]; then
            echo "Service never answered on :8000. uvicorn output:"
            cat uvicorn.log
            exit 1
          fi

          cat health.json
          # models_loaded is a per-family dict, not an int, and the check is
          # EXACT EQUALITY rather than a per-key lookup: one aggregate - or a
          # subset test - would still look plausible if a family loaded twice
          # and another not at all. The cost is that adding a league means
          # editing this line, which is the right way round; a check that
          # tolerated a new family silently would also tolerate a missing one.
          #
          # wnba: 3 and gleague: 3 were added by each league's phase 4. Both
          # services refuse to boot unless their directory matches their own
          # manifest, so a wrong count here means the manifest and the
          # directory agreed on something unexpected.
          #
          # The G League entry also makes this job a COLD-START test for the
          # third league: a broken artifact takes NBA and WNBA serving down
          # with it, which is deliberate but acceptable only because it fails
          # here rather than on a live day. Negative-tested by renaming an
          # artifact in the running container - the service refused to start
          # and named the missing one.
          #
          # nfl: 3 is phase 4's, and the assertion beside it is the one this
          # league needs that the others do not: /health must report
          # synthetic TRUE here. If it ever reports false, CI has found a
          # real NFL table in a checkout - which would mean a CC BY-SA table
          # had been committed, and that is a licence problem rather than a
          # test failure.
          python -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok', h; m = h['models_loaded']; assert m == {'team': 7, 'quarter_half': 6, 'player_props': 10, 'wnba': 3, 'gleague': 3, 'nfl': 3}, m; assert h['nfl']['synthetic'] is True, 'CI must be serving the synthetic NFL set, not a real one'; print('health OK:', h)"

          kill "$UVICORN_PID"

  docker-build:
    name: docker build (all images)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # player_boxscores_with_rolling.csv is stored in Git LFS.
          # Without this, checkout leaves a ~130-byte pointer file
          # where a 77 MB CSV should be, and the failure is confusing:
          # pandas reports a malformed CSV, or COPY succeeds with
          # garbage. Only the two jobs that read it pay the download.
          lfs: true

      # Build only. This asks whether every Dockerfile still produces a
      # valid image, which is a different question from whether the stack
      # runs - that one is answered by `docker compose up` locally.
      - name: Build all images
        run: docker compose build
