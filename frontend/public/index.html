<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The cream ground, so mobile browser chrome matches the page
         rather than flashing create-react-app's black. Kept in step with
         --cream in tokens.css and theme_color in manifest.json. -->
    <meta name="theme-color" content="#f0eee6" />
    <meta
      name="description"
      content="A personal sportsbook. Predictions for NBA games, quarters, halves and player stats."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Familjen Grotesk for all UI chrome, Source Serif 4 for body prose only.
      Free stand-ins for Styrene and Tiempos, which are licensed.

      preconnect to BOTH hosts: googleapis serves the CSS, gstatic serves the
      font files themselves, and the second connection is not opened until
      the CSS has parsed unless it is hinted here.

      display=swap so text paints in the fallback immediately rather than
      staying invisible while the request is in flight. tokens.css gives
      every family a real fallback stack for the same reason - a blocked
      request should degrade to system-ui or Georgia, not to Times New Roman.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Modellarium</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
