# SPA fallback for client-side routing.
#
# WHY THIS FILE EXISTS. The app is a single bundle that renders /,
# /predictions/:sport and /predictions/:sport/game/:id from JavaScript.
# React Router rewrites the address bar without asking the server for
# anything, so those paths work while navigating and do not exist on disk.
# The moment the browser asks nginx for one directly - a hard refresh, a
# pasted link, a bookmark, a new tab - the default config looks for
# /usr/share/nginx/html/predictions/basketball, finds nothing, and returns
# its own 404 page. The app never loads, so its own "no such sport" screen
# never gets the chance to answer.
#
# Invisible in dev: `npm start` runs webpack-dev-server, which already does
# this fallback. The bug exists only in the production image.

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # THE STATIC BLOCK MUST COME FIRST, AND IT IS THE POINT OF THE SPLIT.
    #
    # A single `location /` with `try_files $uri $uri/ /index.html` fixes
    # routing and breaks assets in the same stroke: a missing bundle then
    # returns index.html with 200 OK, the browser parses HTML as JavaScript,
    # and the console says `Unexpected token '<'` - an error about syntax,
    # for a problem about a missing file. Exactly the misleading-green this
    # project keeps rejecting elsewhere: a 200 that means failure.
    #
    # It is not hypothetical. create-react-app emits hashed chunk names, so
    # a redeploy invalidates every old one; a client holding a stale
    # index.html asks for a chunk that no longer exists, and under the naive
    # config gets HTML back instead of a 404 telling it to reload.
    #
    # Everything create-react-app generates lands under /static/, so a
    # `=404` there covers all of it without guessing at file extensions -
    # an extension test would have to decide what /predictions/v1.2 is.
    location /static/ {
        try_files $uri =404;
    }

    # Everything else is either a real file (favicon.ico, manifest.json) or
    # a client-side route. $uri first means a real file always wins; the
    # fallback only runs when nothing matched.
    #
    # index.html, NOT =404: an unknown path like /nonsense is meant to load
    # the app and let IT say there is nothing there, which is how a
    # mistyped sport reaches the "No such sport" screen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
